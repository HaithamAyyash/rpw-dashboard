; NAKHEL cluster head firmware (ESP32). See README.md.
[platformio]
default_envs = esp32dev

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity

[esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1

; What goes on a real cluster head.
[env:esp32dev]
extends = esp32

; Same firmware plus a fake measurement every minute, to try the uplink before the LoRa code exists.
; The node must be registered under this cluster head's key. Never deploy this one.
[env:esp32dev_demo]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DNAKHEL_DEMO_SOURCE=1

; Unit tests on the build machine: no board needed.
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -pthread
lib_compat_mode = off
